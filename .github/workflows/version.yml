name: Generate version.php

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'version.php'

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate version.php
        run: |
          HASH=$(git rev-parse --short HEAD)
          FULL_HASH=$(git rev-parse HEAD)
          DATE=$(git log -1 --format="%ci" | cut -d' ' -f1,2)
          echo "<?php" > version.php
          echo "// Plik generowany automatycznie przez GitHub Actions — nie edytuj recznie" >> version.php
          echo "define('APP_COMMIT_HASH', '${HASH}');" >> version.php
          echo "define('APP_COMMIT_DATE', '${DATE}');" >> version.php
          echo "define('APP_COMMIT_URL', 'https://github.com/enclude/www.timer.pifpaf.fun/commit/${FULL_HASH}');" >> version.php

      - name: Commit version.php
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add version.php
          git commit -m "chore: update version.php [skip ci]"
          git push
